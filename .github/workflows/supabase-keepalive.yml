name: Supabase keep-alive

# Free-tier Supabase pauses after 7 days without activity; the digest only runs weekly.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/waitlist_signups?select=id&limit=1")
          echo "Supabase HTTP $code"
          [ "$code" = "200" ]
