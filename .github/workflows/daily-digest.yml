name: Daily digest

# Wekelijks op maandag. 06:00 UTC = 07:00 lokaal (winter, CET) / 08:00 lokaal (zomer, CEST).
# CLAUDE.md's DIGEST_SEND_TIME=07:00 wordt dus in de zomer iets later bereikt;
# GitHub Actions cron kent geen tijdzones, dit is een bewuste keuze.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: scrapen en verwerken, niets versturen"
        type: boolean
        default: true

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run digest pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          MAX_TENDERS_PER_DIGEST: ${{ secrets.MAX_TENDERS_PER_DIGEST }}
          MIN_RELEVANCE_SCORE: ${{ secrets.MIN_RELEVANCE_SCORE }}
          # Leeg = e-Procurement overgeslagen; PR zodra BOSA productie activeert
          EPROC_ENV: ${{ secrets.EPROC_ENV }}
          EPROC_PR_TOKEN_URL: ${{ secrets.EPROC_PR_TOKEN_URL }}
          EPROC_PR_CLIENT_ID: ${{ secrets.EPROC_PR_CLIENT_ID }}
          EPROC_PR_CLIENT_SECRET: ${{ secrets.EPROC_PR_CLIENT_SECRET }}
        run: uv run python -m mailer.run ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY not set — skipping failure alert"
            exit 0
          fi
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"$FROM_EMAIL\",
              \"to\": [\"filip@kansenradar.be\"],
              \"subject\": \"Kansenradar digest-pipeline FAILED\",
              \"html\": \"<p>De dagelijkse digest-run is mislukt.</p><p><a href=\\\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\\\">Bekijk de logs</a></p>\"
            }"
